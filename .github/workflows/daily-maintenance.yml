# Keeps the free Supabase database awake and empties old Trash once a day.
# Needs two repository secrets: SITE_URL (e.g. https://gupta-properties-xi.vercel.app) and CRON_SECRET.
name: Daily maintenance

on:
  schedule:
    - cron: "30 0 * * *" # 06:00 IST every day
  workflow_dispatch: # allows a manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call maintenance endpoint
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL / CRON_SECRET secrets are not set yet; skipping."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/daily"
